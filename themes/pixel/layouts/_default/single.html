{{ define "main" }}
<article>
  <h1 class="post-title">{{ .Title }}</h1>
  <div class="post-meta">
    {{ .Date.Format "2006-01-02" }} · {{ .ReadingTime }} 分钟阅读
    {{ range .Params.tags }}<span class="p-tag">{{ . }}</span>{{ end }}
  </div>
  <div class="post-content">{{ .Content }}</div>
</article>
<div class="post-nav">
  {{ with .PrevInSection }}<a class="btn8" href="{{ .Permalink }}">← {{ .Title }}</a>{{ end }}
  {{ with .NextInSection }}<a class="btn8" href="{{ .Permalink }}">{{ .Title }} →</a>{{ end }}
</div>
{{ end }}
