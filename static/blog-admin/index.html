<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2e8b74">
<title>博客管理 · 手机版</title>
<style>
:root{--green:#2e8b74;--bg:#f4f6f5;--card:#fff;--ink:#223;--sub:#8b93a5;--line:#e3e8e6;--amber:#b07d2b;--red:#c0392b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
header{position:sticky;top:0;z-index:10;background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;font-weight:600;flex:1}
header button{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 12px;border-radius:8px;font-size:14px}
main{padding:12px;max-width:820px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h2{font-size:16px;margin-bottom:4px}
.card .meta{font-size:13px;color:var(--sub)}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--line);color:var(--sub);margin-right:6px}
.badge.draft{background:#f7ecd7;color:var(--amber)}
.badge.cat{background:#e3f2ec;color:var(--green)}
button.primary{background:var(--green);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-size:15px;width:100%}
button.danger{background:#fbeae7;color:var(--red);border:none;padding:8px 14px;border-radius:8px}
button.ghost{background:var(--line);border:none;padding:8px 14px;border-radius:8px;color:var(--ink)}
.row{display:flex;gap:8px;margin:10px 0}
.row button{flex:1}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;font-family:inherit;background:#fff}
textarea{resize:vertical;min-height:120px}
textarea#bodyText{min-height:46vh;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:14px;line-height:1.7}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:14px}
.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.mdbar{display:flex;gap:6px;margin:0 0 8px;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch}
.mdbar button{flex:0 0 auto;min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px;color:var(--ink);display:flex;align-items:center;justify-content:center}
.mdbar button:active{background:var(--green);color:#fff}
.mdbar button.aibtn{background:#f7ecd7;color:var(--amber);border-color:#ecd9a8}
.mdbar button.aibtn:active{background:var(--amber);color:#fff}
#preview{background:var(--card);border-radius:12px;padding:16px;margin-bottom:10px;display:none}
#preview h1{font-size:20px;margin:10px 0}#preview h2{font-size:18px;margin:10px 0 4px;border-left:3px solid var(--green);padding-left:8px}
#preview h3{font-size:16px;margin:8px 0}#preview p{margin:6px 0}#preview ul{padding-left:20px}
#preview blockquote{border-left:3px solid var(--line);padding-left:10px;color:var(--sub);margin:8px 0}
#preview img{max-width:100%;border-radius:8px}
#preview hr{border:none;border-top:1px solid var(--line);margin:14px 0}
#preview sup{color:var(--green)}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
#viewLogin{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:68vh}
#viewLogin .lock{font-size:46px;text-align:center}
#viewLogin .card{max-width:340px;width:100%}
#viewLogin input{text-align:center;letter-spacing:2px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50;align-items:center;justify-content:center;padding:20px}
#overlay.show{display:flex}
#aiOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:60;align-items:center;justify-content:center;padding:16px}
#aiOverlay.show{display:flex}
#aiOverlay .dialog{max-width:520px;max-height:88vh;display:flex;flex-direction:column}
#aiOverlay .dialog textarea{flex:0 0 auto}
.dialog{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:420px;max-height:80vh;overflow:auto}
.empty{text-align:center;color:var(--sub);padding:40px 0}
footer{text-align:center;color:var(--sub);font-size:12px;padding:16px}
</style>
</head>
<body>
<header>
  <h1 id="pageTitle">📝 博客管理</h1>
  <button id="btnLogout" style="display:none">退出</button>
  <button id="btnSettings">设置</button>
</header>
<main>
  <!-- 登录视图 -->
  <section id="viewLogin">
    <div class="card">
      <div class="lock">🔒</div>
      <h2 style="text-align:center;margin-bottom:4px">管理员登录</h2>
      <p style="text-align:center;color:var(--sub);font-size:13px">此页面需要管理员密码</p>
      <label>管理员密码</label>
      <input id="loginPwd" type="password" placeholder="••••••••">
      <div class="row">
        <button class="primary" id="btnLogin">进入管理</button>
      </div>
      <button class="ghost" id="btnLoginSettings" style="width:100%">设置 API 地址</button>
    </div>
  </section>

  <!-- 列表视图 -->
  <section id="viewList">
    <div class="row">
      <button class="primary" id="btnNew">＋ 新建文章</button>
      <button class="ghost" id="btnRefresh">刷新</button>
      <button class="ghost" id="btnStatus">状态</button>
    </div>
    <div id="postList"></div>
  </section>

  <!-- 编辑视图 -->
  <section id="viewEdit" style="display:none">
    <div class="row">
      <button class="ghost" id="btnBack">← 返回</button>
      <button class="primary" id="btnSave">💾 保存</button>
    </div>
    <div class="card">
      <label>标题</label><input id="fTitle" placeholder="文章标题">
      <label>日期</label><input id="fDate" type="datetime-local" step="1">
      <label>标签（逗号分隔）</label><input id="fTags" placeholder="民法, 笔记">
      <label>分类</label><input id="fCats" placeholder="研究">
      <label>摘要</label><textarea id="fSummary" rows="2"></textarea>
      <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="fDraft" style="width:auto"> 草稿（不发布）</label>
    </div>
    <div class="tabs">
      <button id="tabEdit" class="on">编辑</button>
      <button id="tabPrev">预览</button>
    </div>
    <div class="mdbar">
      <button data-act="b" title="加粗"><b>B</b></button>
      <button data-act="i" title="斜体"><i>I</i></button>
      <button data-act="h" title="标题">H</button>
      <button data-act="q" title="引用">❝</button>
      <button data-act="ul" title="列表">•</button>
      <button data-act="link" title="链接">🔗</button>
      <button data-act="fn" title="脚注">脚注</button>
      <button data-act="code" title="代码">`</button>
      <button data-act="ai" title="AI 整理" class="aibtn">🤖</button>
    </div>
    <textarea id="bodyText" placeholder="# 标题&#10;&#10;正文 Markdown…"></textarea>
    <div id="preview"></div>
    <div class="row">
      <button class="ghost" id="btnSaveAs">另存为…</button>
      <button class="danger" id="btnDelete">删除</button>
    </div>
    <p id="fileName" style="font-size:12px;color:var(--sub);text-align:center;margin-top:8px"></p>
  </section>
</main>

<div id="overlay">
  <div class="dialog">
    <h3 style="margin-bottom:8px">⚙️ 设置</h3>
    <label>API 地址（Worker URL）</label>
    <input id="setApi" placeholder="https://lucas-blog-admin.xxx.workers.dev">
    <p style="font-size:12px;color:var(--sub);margin:8px 0">API 地址是部署 Worker 时生成的地址，管理员密码在登录页输入。</p>
    <div class="row">
      <button class="primary" id="btnSaveSettings">保存</button>
      <button class="ghost" id="btnCloseSettings">取消</button>
    </div>
  </div>
</div>

<div id="aiOverlay">
  <div class="dialog">
    <h3 style="margin-bottom:8px">🤖 AI 文字整理</h3>
    <p style="font-size:13px;color:var(--sub);margin-bottom:8px">粘贴普通文字（口语也行），AI 会整理成规范 Markdown。</p>
    <textarea id="aiInput" placeholder="在这里粘贴你的普通文字…" style="min-height:140px"></textarea>
    <div class="row">
      <button class="primary" id="aiGo">转换</button>
      <button class="ghost" id="aiClose">关闭</button>
    </div>
    <label>结果（可手动修改）</label>
    <textarea id="aiResult" style="min-height:180px;font-family:ui-monospace,Consolas,monospace;font-size:14px"></textarea>
    <div class="row">
      <button class="primary" id="aiInsert">⬇️ 插入正文末尾</button>
      <button class="ghost" id="aiCopy">复制</button>
    </div>
  </div>
</div>

<footer>君子终日乾乾，夕惕若厉，无咎</footer>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let posts = [];
let current = null;   // { name, sha, meta, content }
let editingNew = false;

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
async function api(path, opts = {}) {
  const base = (localStorage.blog_admin_api || "").replace(/\/+$/, "");
  const token = localStorage.blog_admin_token || "";
  if (!base) throw new Error("请先在设置里填写 API 地址");
  const r = await fetch(base + path, {
    ...opts,
    headers: { "Content-Type": "application/json", "X-Access-Token": token, ...(opts.headers || {}) },
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) throw new Error("管理员密码错误");
  if (!r.ok) throw new Error((data && data.error) || "请求失败 " + r.status);
  return data;
}
function nowIso() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}+08:00`;
}
function slugify(title, max = 30) {
  return title.replace(/[^\w\u4e00-\u9fff]+/g, "-").replace(/^-+|-+$/g, "").slice(0, max);
}
function buildFM(meta) {
  const arr = (v) => (v && v.length ? `[${v.map((x) => `"${x}"`).join(", ")}]` : "[]");
  const lines = ["---", `title: "${meta.title}"`, `summary: "${meta.summary || ""}"`, `date: ${meta.date}`,
    `lastmod: ${nowIso()}`, `categories: ${arr(meta.categories)}`, `tags: ${arr(meta.tags)}`,
    `draft: ${meta.draft ? "true" : "false"}`, "---"];
  return lines.join("\n");
}
function splitFM(text) {
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  return m ? [m[1], m[2]] : ["", text];
}
function parseFMBlock(block) {
  const meta = { title: "", summary: "", date: nowIso(), categories: [], tags: [], draft: false };
  for (const line of block.split(/\r?\n/)) {
    const km = line.match(/^([A-Za-z_][\w]*)\s*:\s*(.*)$/);
    if (!km) continue;
    let val = km[2].trim();
    if (val.startsWith("[") && val.endsWith("]")) meta[km[1]] = val.slice(1, -1).split(",").map((s) => s.trim().replace(/^"|"$/g, "")).filter(Boolean);
    else if (km[1] === "draft") meta[km[1]] = val === "true";
    else meta[km[1]] = val.replace(/^"|"$/g, "");
  }
  return meta;
}

/* ---------- 列表 ---------- */
async function loadPosts() {
  $("postList").innerHTML = '<div class="empty">加载中…</div>';
  try {
    posts = await api("/api/posts");
    renderList();
  } catch (e) {
    $("postList").innerHTML = `<div class="empty">⚠️ ${esc(e.message)}</div>`;
  }
}
function renderList() {
  if (!posts.length) {
    $("postList").innerHTML = '<div class="empty">还没有文章，点「新建文章」开始</div>';
    return;
  }
  $("postList").innerHTML = posts.map((p) => `
    <div class="card" data-name="${esc(p.name)}" onclick="openPost('${esc(p.name)}')">
      <h2>${esc(p.meta.title || p.name)}</h2>
      <div class="meta">${esc((p.meta.date || "").slice(0, 10))} · ${esc(p.name)}</div>
      <div style="margin-top:6px">
        ${(p.meta.draft ? '<span class="badge draft">草稿</span>' : "")}
        ${(p.meta.categories || []).map((c) => `<span class="badge cat">${esc(c)}</span>`).join("")}
      </div>
    </div>`).join("");
}

/* ---------- 编辑 ---------- */
async function openPost(name) {
  try {
    const d = await api("/api/posts/" + encodeURIComponent(name));
    current = d;
    editingNew = false;
    const [fmBlock, body] = splitFM(d.content);
    const meta = parseFMBlock(fmBlock);
    $("fTitle").value = meta.title || "";
    $("fDate").value = (meta.date || nowIso()).slice(0, 16);
    $("fTags").value = (meta.tags || []).join(", ");
    $("fCats").value = (meta.categories || []).join(", ");
    $("fSummary").value = meta.summary || "";
    $("fDraft").checked = !!meta.draft;
    $("bodyText").value = body.replace(/^\n+/, "");
    $("fileName").textContent = "文件：" + name;
    showEdit();
  } catch (e) {
    toast("❌ " + e.message);
  }
}
function newPost() {
  current = null;
  editingNew = true;
  $("fTitle").value = "";
  $("fDate").value = nowIso().slice(0, 16);
  $("fTags").value = "";
  $("fCats").value = "研究";
  $("fSummary").value = "";
  $("fDraft").checked = true;
  $("bodyText").value = "";
  $("fileName").textContent = "新文章（保存时生成文件名）";
  showEdit();
}
function collect() {
  const title = $("fTitle").value.trim();
  if (!title) throw new Error("请填写标题");
  const meta = {
    title,
    summary: $("fSummary").value.trim(),
    date: ($("fDate").value || nowIso().slice(0, 16)).replace(" ", "T") + ":00+08:00",
    categories: $("fCats").value.split(/[,，]/).map((s) => s.trim()).filter(Boolean),
    tags: $("fTags").value.split(/[,，]/).map((s) => s.trim()).filter(Boolean),
    draft: $("fDraft").checked,
  };
  if (!meta.categories.length) meta.categories = ["研究"];
  return meta;
}
function fullMarkdown() {
  const meta = collect();
  const body = $("bodyText").value.replace(/\n+$/, "") + "\n";
  return buildFM(meta) + "\n" + body;
}
async function savePost(renameTo) {
  const meta = collect();
  const datePart = meta.date.slice(0, 10);
  const name = renameTo || (current ? current.name : `${datePart}-${slugify(meta.title)}.md`);
  const d = await api("/api/posts/" + encodeURIComponent(name), {
    method: "PUT",
    body: JSON.stringify({ content: fullMarkdown(), message: "blog: " + meta.title }),
  });
  current = { name, content: fullMarkdown() };
  editingNew = false;
  $("fileName").textContent = "文件：" + name;
  toast(d.created ? "✅ 已创建（触发自动构建）" : "✅ 已保存（触发自动构建）");
  loadPosts();
}
async function deletePost() {
  if (!current) return;
  if (!confirm("确定删除「" + current.name + "」吗？")) return;
  await api("/api/posts/" + encodeURIComponent(current.name), { method: "DELETE" });
  toast("已删除");
  current = null;
  showList();
  loadPosts();
}

/* ---------- 视图切换 ---------- */
function showList() {
  $("viewLogin").style.display = "none";
  $("viewList").style.display = "";
  $("viewEdit").style.display = "none";
  $("pageTitle").textContent = "📝 博客管理";
  $("btnLogout").style.display = "";
  loadPosts();
}
function showLogin() {
  $("viewLogin").style.display = "flex";
  $("viewList").style.display = "none";
  $("viewEdit").style.display = "none";
  $("pageTitle").textContent = "🔒 管理员登录";
  $("btnLogout").style.display = "none";
  $("loginPwd").value = "";
  setTimeout(() => $("loginPwd").focus(), 50);
}
function doLogin() {
  const pwd = $("loginPwd").value.trim();
  if (!pwd) { toast("请输入密码"); return; }
  localStorage.blog_admin_token = pwd;
  loadPosts().then(() => toast("✅ 登录成功")).catch((e) => {
    localStorage.removeItem("blog_admin_token");
    toast("❌ " + e.message);
    showLogin();
  });
}
function doLogout() {
  localStorage.removeItem("blog_admin_token");
  current = null;
  posts = [];
  showLogin();
}
function boot() {
  if (localStorage.blog_admin_token) {
    loadPosts().then(showList).catch(() => {
      localStorage.removeItem("blog_admin_token");
      showLogin();
    });
  } else {
    showLogin();
  }
}
function showEdit() {
  $("viewList").style.display = "none";
  $("viewEdit").style.display = "";
  $("pageTitle").textContent = editingNew ? "✏️ 新文章" : "✏️ 编辑";
  switchTab("edit");
}
function switchTab(mode) {
  const edit = mode === "edit";
  $("tabEdit").className = edit ? "on" : "";
  $("tabPrev").className = edit ? "" : "on";
  $("bodyText").style.display = edit ? "" : "none";
  $("preview").style.display = edit ? "none" : "";
  if (!edit) renderPreview();
}
function renderPreview() {
  const md = $("bodyText").value;
  let html = "";
  for (const line of md.split("\n")) {
    const t = line.trim();
    if (!t) continue;
    if (/^#{1,4} /.test(t)) {
      const lvl = t.match(/^#+/)[0].length;
      html += `<h${Math.min(lvl, 4)}>${esc(t.replace(/^#+\s*/, ""))}</h${Math.min(lvl, 4)}>`;
    } else if (/^>\s?/.test(t)) html += `<blockquote>${esc(t.replace(/^>\s?/, ""))}</blockquote>`;
    else if (/^\d+\.\s/.test(t) || /^[-*]\s/.test(t)) html += `<p>${esc(t)}</p>`;
    else if (/^!\[.*\]\(.*\)$/.test(t)) html += `<img src="${esc(t.match(/\(([^)]*)\)/)[1])}" alt="">`;
    else if (/^---$/.test(t)) html += "<hr>";
    else html += `<p>${esc(t).replace(/\[(\^?\d+)\]/g, "<sup>$1</sup>")}</p>`;
  }
  $("preview").innerHTML = html || '<p style="color:var(--sub)">（空）</p>';
}

/* ---------- 状态 ---------- */
async function showStatus() {
  try {
    const d = await api("/api/status");
    const run = d.run || {};
    const site = d.site || {};
    let msg = "";
    if (run.html_url) msg += `GitHub Actions：${run.status || "?"} / ${run.conclusion || "运行中"}\n`;
    else if (run.error) msg += `Actions 获取失败：${run.error}\n`;
    else msg += "Actions：暂无运行记录\n";
    msg += `最近更新：${(run.updated_at || "-").slice(0, 16)}\n`;
    msg += `首页：${site.code ? "HTTP " + site.code + (site.ok ? " ✅" : " ⚠️") : "不可达"}\n`;
    if (run.html_url) msg += `\n${run.html_url}`;
    alert("📊 站点状态\n\n" + msg);
  } catch (e) {
    toast("❌ " + e.message);
  }
}

/* ---------- 设置 ---------- */
function openSettings() {
  $("setApi").value = localStorage.blog_admin_api || "";
  $("overlay").classList.add("show");
}
function saveSettings() {
  localStorage.blog_admin_api = $("setApi").value.trim();
  $("overlay").classList.remove("show");
  toast("设置已保存");
  loadPosts();
}

/* ---------- 事件绑定 ---------- */
$("btnNew").onclick = newPost;
$("btnRefresh").onclick = loadPosts;
$("btnStatus").onclick = showStatus;
$("btnSettings").onclick = openSettings;
$("btnLogin").onclick = doLogin;
$("btnLogout").onclick = doLogout;
$("btnLoginSettings").onclick = openSettings;
$("loginPwd").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
$("btnSaveSettings").onclick = saveSettings;
$("btnCloseSettings").onclick = () => $("overlay").classList.remove("show");
$("overlay").onclick = (e) => { if (e.target === $("overlay")) $("overlay").classList.remove("show"); };
$("btnBack").onclick = showList;
$("btnSave").onclick = () => { try { savePost(); } catch (e) { toast("❌ " + e.message); } };
$("btnSaveAs").onclick = () => {
  const title = $("fTitle").value.trim();
  const datePart = ($("fDate").value || "").slice(0, 10);
  const def = `${datePart}-${slugify(title)}.md`;
  const name = prompt("另存为文件名：", def);
  if (name) { try { savePost(name); } catch (e) { toast("❌ " + e.message); } }
};
$("btnDelete").onclick = () => { deletePost().catch((e) => toast("❌ " + e.message)); };
$("tabEdit").onclick = () => switchTab("edit");
$("tabPrev").onclick = () => switchTab("prev");
$("fDraft").onchange = () => {};

/* ---------- 格式按钮（选中文字 → 转 md 语法） ---------- */
function selRange() {
  const t = $("bodyText");
  return { t, s: t.selectionStart, e: t.selectionEnd };
}
function applyWrap(pre, post, placeholder) {
  const { t, s, e } = selRange();
  const sel = t.value.slice(s, e);
  if (sel) {
    t.value = t.value.slice(0, s) + pre + sel + post + t.value.slice(e);
    t.focus();
    t.selectionStart = s + pre.length;
    t.selectionEnd = s + pre.length + sel.length;
  } else {
    const ph = placeholder || pre + post;
    t.value = t.value.slice(0, s) + ph + t.value.slice(e);
    t.focus();
    const ps = s + pre.length;
    t.selectionStart = ps;
    t.selectionEnd = ps + Math.max(0, ph.length - pre.length - post.length);
  }
}
function applyLinePrefix(prefix) {
  const { t, s } = selRange();
  const ls = t.value.lastIndexOf("\n", s - 1) + 1;
  t.value = t.value.slice(0, ls) + prefix + t.value.slice(ls);
  t.focus();
  t.selectionStart = t.selectionEnd = ls + prefix.length;
}
function applyLink() {
  const { t, s, e } = selRange();
  const sel = t.value.slice(s, e) || "链接文字";
  t.value = t.value.slice(0, s) + "[" + sel + "](https://)" + t.value.slice(e);
  t.focus();
  t.selectionStart = s + 1 + sel.length + 3;
  t.selectionEnd = t.selectionStart + 8;
}
function applyFootnote() {
  const { t, s } = selRange();
  const nums = [...t.value.matchAll(/\[\^(\d+)\]/g)].map((m) => parseInt(m[1]));
  const n = nums.length ? Math.max(...nums) + 1 : 1;
  t.value = t.value.slice(0, s) + "[^" + n + "]" + t.value.slice(s);
  t.value = t.value.replace(/\s+$/, "") + "\n\n[^" + n + "]: ";
  t.focus();
  t.selectionStart = t.selectionEnd = t.value.length;
}
document.querySelectorAll(".mdbar button").forEach((b) => {
  ["touchstart", "mousedown"].forEach((ev) => b.addEventListener(ev, (e) => e.preventDefault()));
  b.addEventListener("click", () => {
    const act = b.dataset.act;
    if (act === "b") applyWrap("**", "**");
    else if (act === "i") applyWrap("*", "*");
    else if (act === "code") applyWrap("`", "`");
    else if (act === "h") applyLinePrefix("## ");
    else if (act === "q") applyLinePrefix("> ");
    else if (act === "ul") applyLinePrefix("- ");
    else if (act === "link") applyLink();
    else if (act === "fn") applyFootnote();
    else if (act === "ai") { $("aiOverlay").classList.add("show"); $("aiInput").focus(); }
  });
});

/* ---------- AI 整理（可选项） ---------- */
let aiBusy = false;
$("aiClose").onclick = () => $("aiOverlay").classList.remove("show");
$("aiOverlay").onclick = (e) => { if (e.target === $("aiOverlay")) $("aiOverlay").classList.remove("show"); };
$("aiGo").onclick = async () => {
  const text = $("aiInput").value.trim();
  if (!text) { toast("请先粘贴文字"); return; }
  if (aiBusy) return;
  aiBusy = true;
  $("aiGo").textContent = "转换中…";
  try {
    const d = await api("/api/ai/format", { method: "POST", body: JSON.stringify({ text }) });
    $("aiResult").value = d.markdown || "";
    toast("✅ 转换完成");
  } catch (e) {
    toast("❌ " + e.message);
  } finally {
    aiBusy = false;
    $("aiGo").textContent = "转换";
  }
};
$("aiInsert").onclick = () => {
  const md = $("aiResult").value.trim();
  if (!md) return;
  const t = $("bodyText");
  t.value = (t.value.replace(/\s+$/, "") ? t.value.replace(/\s+$/, "") + "\n\n" : "") + md + "\n";
  $("aiOverlay").classList.remove("show");
  toast("已插入正文末尾");
};
$("aiCopy").onclick = () => {
  const md = $("aiResult").value;
  if (navigator.clipboard) navigator.clipboard.writeText(md).then(() => toast("已复制"));
  else { $("aiResult").select(); document.execCommand("copy"); toast("已复制"); }
};

/* 启动 */
boot();
</script>
